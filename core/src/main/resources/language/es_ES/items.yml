# SmartSpawner – items.yml
# Spawner item display names and drop item names.

# Appearance of smart spawner items in inventory and tooltips
# Available placeholders: {entity}, {ᴇɴᴛɪᴛʏ}, {exp}, {loot_items}, {amount}, {item_name}, {chance}
smart_spawner:
  default:
    name: 'Generador de &#5DB5F1{entity}'
    loot_items: '  &#ecf0f1 • {amount} {item_name} &#3498db({chance}%)'
    loot_items_empty: '  &#ecf0f1 •  Ninguno'
    lore:
      - ''
      - ' &#5DB5F1 ᴅᴇᴛᴀʟʟᴇ:'
      - '  &#ecf0f1 • &fDar experiencia: &a{exp}'
      - ''
      - ' &#5DB5F1 ʙᴏᴛíɴ:'
      - '{loot_items}'
      - ''
  # Entity-specific sections override default per key. Unspecified keys use default.
  PIG:
    name: 'Generador de &#FF77B7{entity}'
    loot_items: '  &#FFF0F7 • {amount} {item_name} &#FF8FC7({chance}%)'
    loot_items_empty: '  &#FFF0F7 •  Ninguno'
    lore:
      - ''
      - ' &#FF77B7 ᴅᴇᴛᴀʟʟᴇ:'
      - '  &#FFF0F7 • &fDar experiencia: &#FF8FC7{exp}'
      - ''
      - ' &#FF77B7 ʙᴏᴛíɴ:'
      - '{loot_items}'
      - ''
  BLAZE:
    name: 'Generador de &#FFB300{entity}'
    loot_items: '  &#FFF4CC • {amount} {item_name} &#FFC107({chance}%)'
    loot_items_empty: '  &#FFF4CC •  Ninguno'
    lore:
      - ''
      - ' &#FFB300 ᴅᴇᴛᴀʟʟᴇ:'
      - '  &#FFF4CC • &fDar experiencia: &#FFD54F{exp}'
      - ''
      - ' &#FFB300 ʙᴏᴛíɴ:'
      - '{loot_items}'
      - ''

