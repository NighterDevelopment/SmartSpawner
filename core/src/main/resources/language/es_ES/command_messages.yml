#                     /ss gui_layout
# ──────────────────────────────────────────────────────
gui_layout:
  current:
    message: "Diseño de interfaz actual: &a{current} &#888888| &fDisponibles: {available}"
    sound: block.note_block.hat
  invalid:
    message: "&#FF4444Diseño de interfaz desconocido: &f{value}&#FF4444. Prueba con: &f{available}"
    sound: block.note_block.pling
  already_set:
    message: "&#F0C857El diseño de interfaz ya está configurado en &f{value}&#F0C857."
    sound: block.note_block.hat
  success:
    message: "Se ha cambiado el diseño de interfaz de &e{old_value} &fa &a{new_value}&f."
    sound: entity.experience_orb.pickup
  error:
    message: "&#FF4444Error al cambiar el diseño de interfaz. Por favor, revisa la consola."
    sound: block.note_block.pling

# ──────────────────────────────────────────────────────
#                     /ss editloot
# ──────────────────────────────────────────────────────
editloot:
  usage:
    message: "Uso: &#37eb9a/ss editloot <nombre_del_generador>&f. Ejemplo: &#37eb9a/ss editloot blaze_spawner"
    sound: block.note_block.hat
  unknown_entry:
    message: "&#FF4444No hay ningún generador llamado &f{name}&#FF4444. Usa el tabulador para ver los nombres válidos."
    sound: block.note_block.bass
  entry_missing:
    message: "&#FF4444Esa entrada ya no está en el archivo."
    sound: block.note_block.bass
  loot_added:
    message: "&#37eb9aSe ha añadido la entrada de botín &f{label}&#37eb9a."
    sound: entity.experience_orb.pickup
  loot_saved:
    message: "&#37eb9aSe ha guardado la entrada de botín &f{label}&#37eb9a."
    sound: entity.experience_orb.pickup
  loot_replaced:
    message: "&#37eb9aSe ha actualizado el objeto para &f{label}&#37eb9a."
    sound: entity.experience_orb.pickup
  loot_deleted:
    message: "&#FF6B6BSe ha eliminado la entrada de botín &f{label}&#FF6B6B."
    sound: entity.item.pickup
  capture_empty:
    message: "&#FF4444Pon primero un objeto en la ranura central."
    sound: block.note_block.bass
