      - '&#37eb9a ▸ &fClick to choose an item!'

  capture_hint:
    name: '&fᴅʀᴏᴘ ᴀɴ ɪᴛᴇᴍ &#5DB5F1ɪɴ ᴛʜᴇ ᴍɪᴅᴅʟᴇ'
