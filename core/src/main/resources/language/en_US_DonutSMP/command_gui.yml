    name: '&aSave'
  dialog_cancel:
    name: '&cCancel'
  dialog_delete:
    name: '&4Delete loot'
  field_amount:
    name: 'Amount (e.g. 1 or 0-2)'
  field_chance:
    name: 'Chance % (0-100)'
  field_durability:
    name: 'Durability (blank for none, e.g. 1-384)'
