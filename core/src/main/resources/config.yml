# SmartSpawner configuration
# Full guide: https://docs.smartspawner.site/docs/configuration
# Time format: 20s, 5m, 1h, or 1d_2h_30m_15s. Units: s m h d w mo y.

# Language folder under language/. Bundled: en_US, en_US_DonutSMP, en_US_DonutSMP_v2, tr_TR, vi_VN.
language: en_US

# GUI layout folder under gui_layouts/. Bundled: default, DonutSMP, DonutSMP_v2.
gui_layout: default

# Verbose console output, for troubleshooting only.
debug: false

spawner_properties:
  default:
    # Mobs generated per cycle, rolled between the two values.
    min_mobs: 1
    max_mobs: 4

    # Player distance in blocks that keeps the spawner running.
    range: 16

    # Time between generation cycles.
    delay: 25s

    # Storage size. Each page holds 45 slots.
    max_storage_pages: 1
    max_stored_exp: 1000
    max_stack_size: 10000

    # Let players repair held items with the XP stored in a spawner.
    allow_exp_mending: true
    protect_from_explosions: true

spawner_break:
  enabled: true

  # Put broken spawners straight into the inventory instead of dropping them.
  direct_to_inventory: false

  required_tools:
    - IRON_PICKAXE
    - GOLDEN_PICKAXE
    - DIAMOND_PICKAXE
    - NETHERITE_PICKAXE

  # Durability taken off the tool per spawner broken.
  durability_loss: 1

  # Sneak to break up to 64 spawners off a stack at once. Off breaks one at a time.
  sneak_break: true

  # Sell the storage and claim the XP when the last spawner of a stack is removed.
  # Needs sell integration and the smartspawner.sellall permission.
  sell_and_xp_break: true

  silk_touch:
    required: true
    level: 1

natural_spawner:
  # Whether dungeon spawners can be broken and collected.
  breakable: false

  # Off makes them drop a vanilla spawner instead of a smart one.
  convert_to_smart_spawner: false

  # Drop chance per type, 0.0 to 100.0. "default" covers every type, entity names override it.
  # Types left out fall back to 100.0.
  # drop_chance:
  #   default: 80.0
  #   ZOMBIE: 75.0

  # Whether natural spawners still spawn mobs.
  spawn_mobs: true
  protect_from_explosions: false

sell_integration:
  enabled: true

  # Economy plugin: VAULT or EXCELLENTECONOMY.
  currency: VAULT

  # Currency name, EXCELLENTECONOMY only.
  excellenteconomy_currency: money

  # Where prices come from: SHOP_ONLY, SHOP_PRIORITY, CUSTOM_ONLY or CUSTOM_PRIORITY.
  price_source_mode: SHOP_PRIORITY

  shop_integration:
    enabled: true
    # auto, EconomyShopGUI, EconomyShopGUI-Premium, ShopGUIPlus or zShop.
    preferred_plugin: auto

  custom_prices:
    enabled: true
    # Price for items with no custom price. 0.0 stops them being sold.
    default_price: 1.0

hopper:
  enabled: false
  # Time between collection checks.
  check_delay: 3s
  # Item stacks moved per collection. Maximum 5.
  stack_per_transfer: 5

bedrock_support:
  # Show Bedrock players a form menu instead of a chest GUI. Needs Floodgate.
  enable_formui: true

hologram:
  # Floating text above spawners.
  enabled: false

  # Offset from the centre of the spawner block.
  offset_x: 0.5
  offset_y: 1.6
  offset_z: 0.5

  # CENTER, LEFT or RIGHT.
  alignment: CENTER
  shadowed_text: true
  # Visible through blocks.
  see_through: false
  transparent_background: false

particle:
  spawner_stack: true
  spawner_activate: true
  spawner_generate_loot: true

# Action logging, file and Discord, lives in activity_log.yml.

database:
  # Storage backend: SQLITE or MYSQL. A config still set to YAML switches to SQLITE on startup
  # and imports spawners_data.yml once.
  mode: SQLITE

  # Prefix for this plugin's tables. Letters, digits and underscore.
  # Set it before the first start, changing it later leaves the old tables behind.
  table_prefix: "sspawner_"

  # A name unique to this server, used when several servers share one MySQL database.
  server_name: "server1"

  # Add a server picker to /ss list showing spawners from every server in the shared database.
  # MYSQL only.
  sync_across_servers: false

  # Import spawners_data.yml on startup, and spawners.db as well when switching to MYSQL.
  # Imported files get a .migrated suffix so they are never read twice.
  migrate_from_local: true

  # Database name, MYSQL only.
  database: "smartspawner"

  sqlite:
    file: "spawners.db"
    # Pooled connections. Lower this to 1 only if lock errors appear in the console.
    pool_size: 4

  sql:
    host: "localhost"
    port: 3306
    username: "root"
    password: ""

    # Connection pool tuning. Milliseconds, except the first two.
    pool:
      maximum-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000
      keepalive-time: 30000
      leak-detection-threshold: 0

performance:
  loot_generation:
    # true switches very large batches to an average-based calculation, which keeps big stacks
    # smooth. false always rolls each mob exactly, closest to vanilla but heavier on CPU.
    approximate_loot: true

    # How long to stay exact before approximating. Lower is cheaper, higher is more precise.
    # Recommended: 1000-10000.
    approximation_threshold: 1000
