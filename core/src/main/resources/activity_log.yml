# Records who did what to a spawner, where and when.
# Full guide: https://docs.smartspawner.site/docs/action-logging
# The event names are listed in the docs.

# Log files written to the logs folder.
file:
  enabled: true

  # true writes JSON, false writes plain text.
  json_format: false
  console_output: false

  # Log files kept before the oldest is deleted, and the size at which each one rotates.
  max_log_files: 10
  max_log_size_mb: 10

  # true logs everything and ignores the list below.
  log_all_events: false
  logged_events:
    - SPAWNER_PLACE
    - SPAWNER_BREAK
    - SPAWNER_EXPLODE
    - SPAWNER_STACK_HAND
    - SPAWNER_STACK_GUI
    - SPAWNER_DESTACK_GUI
    - SPAWNER_EXP_CLAIM
    - SPAWNER_SELL_ALL
    - SPAWNER_ITEM_TAKE_ALL
    - SPAWNER_ITEMS_SORT
    - SPAWNER_ITEM_FILTER
    - SPAWNER_DROP_PAGE_ITEMS
    - COMMAND_EXECUTE_PLAYER
    - COMMAND_EXECUTE_CONSOLE
    - COMMAND_EXECUTE_RCON

# The same events sent to a Discord channel. Works with or without file logging.
discord:
  enabled: false

  # Discord server settings, Integrations, Webhooks, New Webhook, then copy the URL.
  webhook_url: ""

  # Show the acting player's head as the message thumbnail.
  show_player_head: true

  # true forwards everything and ignores the list below.
  log_all_events: false
  logged_events:
    - SPAWNER_PLACE
    - SPAWNER_BREAK
    - SPAWNER_EXPLODE
    - SPAWNER_STACK_HAND
    - SPAWNER_STACK_GUI
    - SPAWNER_DESTACK_GUI
    - SPAWNER_GUI_OPEN
    - COMMAND_EXECUTE_PLAYER
    - COMMAND_EXECUTE_CONSOLE
    - COMMAND_EXECUTE_RCON

# The Discord message for each event. An event with no block here falls back to a plain message.
# Placeholders: {player}, {player_uuid}, {entity}, {location}, {world}, {x}, {y}, {z},
# {time}, {timestamp}, {event_type}, {description}, plus the ones used in each block below.
embeds:
  SPAWNER_PLACE:
    title: "✅ Spawner Placed"
    description: "**{player}** placed a **{entity}** spawner"
    color: "57F287"
    footer: "SmartSpawner • {time}"
    fields:
      - name: "📍 Location"
        value: "`{location}`"
        inline: false
      - name: "🐾 Entity"
        value: "`{entity}`"
        inline: true
      - name: "🔢 Quantity"
        value: "`{quantity}`"
        inline: true

  SPAWNER_BREAK:
