# Item spawners: which items can be an Item Spawner, and what each one produces.
# Guide and examples: https://openvdra.github.io/SmartSpawner/spawner-items/

netherite_ingot_spawner:
  item: NETHERITE_INGOT
  experience: 1
  loot:
    1:
      item: NETHERITE_INGOT
      amount: 1-1
      chance: 100.0
  mob_head:
